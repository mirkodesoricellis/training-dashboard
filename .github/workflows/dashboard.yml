name: Genera e pubblica dashboard

on:
  schedule:
    # 9:00, 14:00, 21:00 ora italiana (Europe/Rome). GitHub cron gira in UTC e non
    # supporta timezone: questi orari (7,12,19 UTC) sono corretti per l'ora legale
    # (CEST, UTC+2, marzo-ottobre). In ora solare (CET, UTC+1, novembre-marzo) la
    # dashboard si genererà un'ora piu' tardi (10:00, 15:00, 22:00 locali) finche'
    # non si aggiorna manualmente questo cron.
    - cron: "0 7,12,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (script + spec, sola lettura)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r scripts/requirements.txt

      - name: Genera dashboard
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          REPO_ROOT: ${{ github.workspace }}
        run: python scripts/generate_dashboard.py

      # Pubblica SOLO sul repo cloud dedicato (mai su questo repo): questo repo resta
      # quello che aggiorni manualmente/tramite Claude, per non avere due processi che
      # si sovrascrivono a vicenda sullo stesso index.html.
      - name: Checkout repo di pubblicazione (training-dashboard-cloud)
        uses: actions/checkout@v4
        with:
          repository: mirkodesoricellis/training-dashboard-cloud
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: publish

      - name: Copia e pubblica su training-dashboard-cloud
        run: |
          cp index.html publish/index.html
          cd publish
          git config user.name "training-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica alla dashboard, salto il commit."
          else
            git commit -m "Aggiorna dashboard cloud $(date -u +%Y-%m-%d)"
            git push
          fi
