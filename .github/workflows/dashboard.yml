name: Genera e pubblica dashboard

on:
  schedule:
    # 05:30 UTC = 07:30 Europe/Rome (CEST) — 06:30 in inverno (CET), va bene comunque
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r scripts/requirements.txt

      - name: Genera dashboard
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE }}
          REPO_ROOT: ${{ github.workspace }}
        run: python scripts/generate_dashboard.py

      - name: Commit e push se ci sono cambiamenti
        run: |
          git config user.name "training-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica alla dashboard, salto il commit."
          else
            git commit -m "Aggiorna dashboard $(date -u +%Y-%m-%d)"
            git push
          fi
