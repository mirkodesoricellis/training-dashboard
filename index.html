<style>
:root{
  --page:#ffffff; --surface-1:#ffffff; --surface-2:#ffffff; --surface-3:#f6f6f5;
  --text:#181817; --text-dim:#6b6b66; --text-faint:#96968f; --line:#e6e6e2;
  --carb:#2a78d6; --prot:#eb6834; --fat:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --accent:#173a5e;
  --shadow:0 1px 2px rgba(20,20,18,.05), 0 4px 14px rgba(20,20,18,.06);
  --shadow-sm:0 1px 2px rgba(20,20,18,.05);
}
:root[data-theme="dark"]{
  --page:#101010; --surface-1:#1a1a19; --surface-2:#1a1a19; --surface-3:#232322;
  --text:#f0f0ec; --text-dim:#a3a39c; --text-faint:#77776f; --line:#2e2e2c;
  --carb:#3987e5; --prot:#d95926; --fat:#199e70; --accent:#8fb6dd;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#101010; --surface-1:#1a1a19; --surface-2:#1a1a19; --surface-3:#232322;
    --text:#f0f0ec; --text-dim:#a3a39c; --text-faint:#77776f; --line:#2e2e2c;
    --carb:#3987e5; --prot:#d95926; --fat:#199e70; --accent:#8fb6dd;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 max(28px,env(safe-area-inset-bottom));
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{
  position:sticky;top:0;z-index:20;background:var(--page);
  border-bottom:1px solid var(--line);
  padding-top:max(10px,env(safe-area-inset-top));
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.4px;flex:none}
:root[data-theme="dark"] .mark{color:#101010}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mark{color:#101010}}
.brand b{font-size:15px;font-weight:650;letter-spacing:-.01em}
.brand span{display:block;font-size:11.5px;color:var(--text-faint);line-height:1.2}
.iconbtn{border:1px solid var(--line);background:var(--surface-1);color:var(--text-dim);
  width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer;flex:none;
  display:grid;place-items:center}
.iconbtn:active{transform:scale(.94)}

/* navigazione giorni */
.nav{display:flex;align-items:center;gap:10px;padding:0 0 10px}
.navbtn{border:1px solid var(--line);background:var(--surface-1);color:var(--text);
  width:38px;height:38px;border-radius:11px;font-size:16px;cursor:pointer;flex:none;display:grid;place-items:center}
.navbtn:disabled{opacity:.32;cursor:default}
.navbtn:active:not(:disabled){transform:scale(.94)}
.navlbl{flex:1;text-align:center;min-width:0}
.navlbl b{display:block;font-size:16.5px;font-weight:650;letter-spacing:-.01em}
.navlbl span{font-size:12px;color:var(--text-faint)}
.badge-today{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:#fff;background:var(--accent);border-radius:5px;padding:1px 5px;vertical-align:1px}
:root[data-theme="dark"] .badge-today{color:#101010}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge-today{color:#101010}}
.dots{display:flex;justify-content:center;gap:7px;padding:0 0 12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--accent);transform:scale(1.18)}

/* card */
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:15px;
  box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.card.accent{border-left:4px solid var(--acc,var(--line))}
.i-high{--acc:var(--crit)} .i-medium{--acc:var(--warn)}
.i-low{--acc:var(--good)}  .i-rest{--acc:var(--text-faint)}
.cardpad{padding:14px 15px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text-faint);margin:0 0 8px}
h2{font-size:16px;font-weight:650;margin:0 0 3px;letter-spacing:-.01em}

.sess{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.sess:first-of-type{border-top:0;padding-top:2px}
.sess .ic{font-size:20px;line-height:1.2;flex:none}
.sess b{display:block;font-size:14.5px;font-weight:600}
.sess p{margin:2px 0 0;font-size:13px;color:var(--text-dim)}
.note{margin:9px 0 0;font-size:12.5px;color:var(--text-dim);background:var(--surface-3);
  border-radius:9px;padding:9px 11px}
.metaline{margin:10px 0 0;font-size:12.5px;color:var(--text-faint);border-top:1px solid var(--line);padding-top:9px}

/* kcal + macro */
.kcal{display:flex;align-items:baseline;gap:8px;margin:2px 0 12px}
.kcal b{font-size:32px;font-weight:680;letter-spacing:-.03em;line-height:1}
.kcal span{font-size:12.5px;color:var(--text-faint)}
.bar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:0 0 9px;background:var(--surface-3)}
.bar i{display:block;height:100%}
.macros{display:flex;gap:8px}
.macro{flex:1;background:var(--surface-3);border-radius:10px;padding:8px 9px}
.macro em{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.macro b{display:block;font-size:17px;font-weight:650;letter-spacing:-.02em;margin-top:1px}
.macro span{font-size:11px;color:var(--text-faint)}
.m-c em{color:var(--carb)} .m-p em{color:var(--prot)} .m-f em{color:var(--fat)}
.split{display:flex;gap:8px;margin:11px 0 0;font-size:12px;color:var(--text-dim)}
.split div{flex:1;background:var(--surface-3);border-radius:9px;padding:7px 9px;text-align:center}
.split b{display:block;font-size:13.5px;color:var(--text);font-weight:600}

/* insight */
.insight{background:var(--surface-1)}
.insight .cardpad{border-left:0}
.insight p{margin:0;font-size:14px;line-height:1.62}

/* pasti */
.meal{border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.mhead{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;user-select:none;
  -webkit-tap-highlight-color:transparent}
.mhead .ic{font-size:18px;flex:none}
.mhead .txt{flex:1;min-width:0}
.mhead b{display:block;font-size:14.5px;font-weight:620}
.mhead span{display:block;font-size:12px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:12px;color:var(--text-faint);transition:transform .22s ease;flex:none}
.meal.open .chev{transform:rotate(90deg)}
.mbody{max-height:0;overflow:hidden;transition:max-height .3s ease}
.meal.open .mbody{max-height:2600px}
.mbody-in{padding:0 15px 14px}
.opt{background:var(--surface-3);border-radius:12px;padding:11px 12px;margin-top:9px}
.opt>em{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:var(--text-faint);margin-bottom:2px}
.opt>b{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;line-height:1.4}
.ing{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3.5px 0;border-top:1px dashed var(--line)}
.ing:first-of-type{border-top:0}
.ing span:last-child{color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;
  color:var(--text-dim);display:flex;flex-wrap:wrap;gap:4px 12px;font-variant-numeric:tabular-nums}
.tot b{color:var(--text);font-weight:650}
.tot .c{color:var(--carb)} .tot .p{color:var(--prot)} .tot .f{color:var(--fat)}

/* fueling */
.phase{background:var(--surface-3);border-radius:12px;padding:11px 12px;margin-top:10px}
.phase>b{display:block;font-size:13px;font-weight:650;margin-bottom:7px}
.supp{margin:11px 0 0;font-size:12.5px;color:var(--text-dim);line-height:1.55}

footer{margin:22px 0 0;padding:16px 0 0;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--text-faint);line-height:1.6}
footer b{color:var(--text-dim);font-weight:650}
footer p{margin:0 0 7px}
</style>
</head>

const D = DATA.days;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = v => Math.round(v).toLocaleString('it-IT');
const todayISO = () => { const t = new Date();
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); };

let TODAY = D.findIndex(d => d.iso === todayISO());
if (TODAY < 0) TODAY = 0;
let idx = TODAY;

function macroBar(t){
  const kc = t.c*4, kp = t.p*4, kf = t.f*9, tot = kc+kp+kf || 1;
  return `<div class="bar">
    <i style="width:${kc/tot*100}%;background:var(--carb)"></i>
    <i style="width:${kp/tot*100}%;background:var(--prot)"></i>
    <i style="width:${kf/tot*100}%;background:var(--fat)"></i></div>`;
}
function macroTiles(t){
  const kc = t.c*4, kp = t.p*4, kf = t.f*9, tot = kc+kp+kf || 1;
  const pc = v => Math.round(v/tot*100)+'%';
  return `<div class="macros">
    <div class="macro m-c"><em>Carbo</em><b>${n(t.c)} g</b><span>${pc(kc)}</span></div>
    <div class="macro m-p"><em>Proteine</em><b>${n(t.p)} g</b><span>${pc(kp)}</span></div>
    <div class="macro m-f"><em>Grassi</em><b>${n(t.f)} g</b><span>${pc(kf)}</span></div></div>`;
}
function totalsRow(t, label){
  return `<div class="tot"><b>${label||'Totale'}: ${n(t.kcal)} kcal</b>
    <span class="c">C ${n(t.c)} g</span><span class="p">P ${n(t.p)} g</span><span class="f">G ${n(t.f)} g</span></div>`;
}
function items(list){
  return list.map(i => `<div class="ing"><span>${esc(i.name)}</span><span>${esc(i.disp || (n(i.g)+' g'))}</span></div>`).join('');
}

function render(){
  const d = D[idx];
  document.getElementById('dayName').innerHTML = esc(d.dow) + (idx===TODAY ? '<span class="badge-today">oggi</span>' : '');
  document.getElementById('dayDate').textContent = d.d + ' 2026';
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === D.length-1;
  document.getElementById('dots').innerHTML = D.map((x,i) =>
    `<button class="dot${i===idx?' on':''}" data-i="${i}" aria-label="${esc(x.dow)}"></button>`).join('');

  let h = '';

  /* --- allenamento --- */
  h += `<section class="card accent i-${d.intensity}"><div class="cardpad">
    <p class="eyebrow">Allenamento</p>`;
  h += d.sessions.length
    ? d.sessions.map(s => `<div class="sess"><div class="ic">${s.icon}</div>
        <div><b>${esc(s.title)}</b><p>${esc(s.detail)}</p></div></div>`).join('')
    : `<div class="sess"><div class="ic">😴</div><div><b>Riposo</b>
        <p>Nessuna sessione a piano: giornata di recupero completo.</p></div></div>`;
  if (d.planned) h += `<p class="note">${esc(d.planned)}</p>`;
  if (d.alt) h += `<p class="note">⚠️ ${esc(d.alt)}</p>`;
  h += `<p class="metaline">${esc(d.load)}</p></div></section>`;

  /* --- insight (solo giorni con attività completata) --- */
  if (d.insight) h += `<section class="card insight"><div class="cardpad">
    <p class="eyebrow">Insight</p><p>${esc(d.insight)}</p></div></section>`;

  /* --- fabbisogno --- */
  h += `<section class="card"><div class="cardpad">
    <p class="eyebrow">Fabbisogno stimato</p>
    <div class="kcal"><b>${n(d.targets.kcal)}</b><span>kcal &middot; ${n(DATA.base)} base${d.spend ? ' + ' + n(d.spend) + ' sessione' : ''}</span></div>
    ${macroBar(d.targets)}${macroTiles(d.targets)}`;
  if (d.fuelTotals) h += `<div class="split">
      <div><b>${n(d.fuelTotals.kcal)}</b>dal fueling</div>
      <div><b>${n(d.mealBudget.kcal)}</b>dai pasti</div></div>
    <p class="note">I pasti qui sotto coprono ${n(d.mealBudget.kcal)} kcal: il resto arriva dal fueling pre/intra/post, calcolato a parte per non contarlo due volte.</p>`;
  h += `</div></section>`;

  /* --- fueling --- */
  if (d.fuel){
    h += `<section class="card"><div class="cardpad">
      <p class="eyebrow">Fueling sessione</p><p class="note" style="margin-top:0">${esc(d.fuel.note)}</p>`;
    ['pre','intra','post'].forEach(k => {
      const p = d.fuel[k]; if (!p) return;
      h += `<div class="phase"><b>${esc(p.label)}</b>${items(p.items)}${totalsRow(p.totals, 'Totale fase')}</div>`;
    });
    if (d.fuel.supp) h += `<p class="supp"><b>Supplementi.</b> ${esc(d.fuel.supp)}</p>`;
    h += `</div></section>`;
  }

  /* --- pasti --- */
  h += `<section class="card">`;
  d.meals.forEach((m, i) => {
    h += `<div class="meal" id="meal${i}">
      <div class="mhead" data-m="${i}">
        <div class="ic">${m.icon}</div>
        <div class="txt"><b>${esc(m.name)} <span style="font-weight:400;color:var(--text-faint)">${m.pct}%</span></b>
          <span>${n(m.target.kcal)} kcal &middot; C ${n(m.target.c)} &middot; P ${n(m.target.p)} &middot; G ${n(m.target.f)} g</span></div>
        <div class="chev">▸</div></div>
      <div class="mbody"><div class="mbody-in">`;
    m.options.forEach((o, j) => {
      h += `<div class="opt"><em>Opzione ${j+1}</em><b>${esc(o.name)}</b>${items(o.items)}${totalsRow(o.totals)}</div>`;
    });
    h += `</div></div></div>`;
  });
  h += `</section>`;

  document.getElementById('view').innerHTML = h;
  document.getElementById('sub').textContent = 'Settimana ' + D[0].d + ' – ' + D[D.length-1].d;
}

document.addEventListener('click', e => {
  const dot = e.target.closest('.dot');
  if (dot){ idx = +dot.dataset.i; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const mh = e.target.closest('.mhead');
  if (mh){ document.getElementById('meal'+mh.dataset.m).classList.toggle('open'); return; }
});
document.getElementById('prev').onclick = () => { if (idx>0){ idx--; render(); } };
document.getElementById('next').onclick = () => { if (idx<D.length-1){ idx++; render(); } };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  && idx>0){ idx--; render(); }
  if (e.key === 'ArrowRight' && idx<D.length-1){ idx++; render(); }
});
document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

document.getElementById('foot').innerHTML = `
<p><b>Metodo.</b> Fabbisogno = BMR (Mifflin-St Jeor, ${DATA.weight} kg / 183 cm / 29 anni → ${n(DATA.bmr)} kcal) × 1,3 per l'attività di base, più la spesa stimata della sessione.
Bici: kcal ≈ (TSS/100) × FTP ${DATA.ftp} W × 3,6. Corsa: ≈ 1 kcal/kg/km. Nuoto e forza: stima da durata e intensità.
Proteine 1,8 g/kg (2,0 nei giorni forza), carboidrati da 3,5 a 8 g/kg secondo il carico, grassi a completare.
Split pasti 22 / 33 / 12 / 33%.</p>
<p><b>Precisione.</b> Il fabbisogno giornaliero è un calcolo standard verificabile. I valori nutrizionali dei singoli alimenti sono <b>stime generiche</b> (tipo USDA/CREA), non verificate su database di prodotto: per i confezionati di marca lo scostamento può essere del 10-20%. Tolleranza dichiarata sulle ricette: ±10-15%.</p>
<p><b>Fonti.</b> COROS (corsa, nuoto, sonno, HRV, stress, recovery, carico) · Garmin Connect (bici) · TrainingPeaks (piano, TSS). Generata il ${DATA.generated}.</p>`;

render();
</script>
