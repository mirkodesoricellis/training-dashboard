<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Hub</title>

<!-- App su home screen. NOTA: iOS ignora i data: URI per apple-touch-icon,
     servono file veri serviti dallo stesso host (GitHub Pages). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Training Hub">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#173a5e">
<style>
:root{
  --page:#ffffff; --surface-1:#ffffff; --surface-2:#ffffff; --surface-3:#f6f6f5;
  --text:#181817; --text-dim:#63635e; --text-faint:#93938c; --line:#e8e8e4;
  --carb:#2a78d6; --prot:#eb6834; --fat:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --accent:#173a5e; --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(20,20,18,.04), 0 6px 20px rgba(20,20,18,.07);
  --ring:rgba(23,58,94,.12);
}
:root[data-theme="dark"]{
  --page:#101010; --surface-1:#1a1a19; --surface-2:#1a1a19; --surface-3:#242423;
  --text:#f1f1ed; --text-dim:#a8a8a1; --text-faint:#7a7a72; --line:#302f2d;
  --carb:#3987e5; --prot:#d95926; --fat:#199e70;
  --accent:#8fb6dd; --on-accent:#101010;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.4);
  --ring:rgba(143,182,221,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#101010; --surface-1:#1a1a19; --surface-2:#1a1a19; --surface-3:#242423;
    --text:#f1f1ed; --text-dim:#a8a8a1; --text-faint:#7a7a72; --line:#302f2d;
    --carb:#3987e5; --prot:#d95926; --fat:#199e70;
    --accent:#8fb6dd; --on-accent:#101010;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.4);
    --ring:rgba(143,182,221,.18);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--page); color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:max(30px,env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.wrap{max-width:620px;margin:0 auto;padding:0 15px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding-top:max(8px,env(safe-area-inset-top));
}
.hrow{display:flex;align-items:center;gap:10px;padding:7px 0 9px}
.mark{width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(160deg,#1d4a75,#102944);
  display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.mark svg{width:20px;height:20px;display:block}
.htxt{flex:1;min-width:0}
.htxt b{display:block;font-size:14.5px;font-weight:640;letter-spacing:-.01em;line-height:1.25}
.htxt span{display:block;font-size:11.5px;color:var(--text-faint);line-height:1.25}
.iconbtn{border:1px solid var(--line);background:var(--surface-1);color:var(--text-dim);
  width:36px;height:36px;border-radius:11px;font-size:15px;cursor:pointer;flex:none;
  display:grid;place-items:center;transition:transform .12s}
.iconbtn:active{transform:scale(.9)}

/* striscia giorni scorrevole */
.strip{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x proximity;
  padding:0 0 10px;margin:0 -15px;padding-left:15px;padding-right:15px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.pill{flex:none;scroll-snap-align:center;min-width:52px;padding:7px 9px 8px;
  border:1px solid var(--line);border-radius:13px;background:var(--surface-1);
  cursor:pointer;text-align:center;transition:all .16s;color:inherit;font:inherit}
.pill em{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;color:var(--text-faint)}
.pill b{display:block;font-size:16px;font-weight:640;letter-spacing:-.02em;margin-top:1px}
.pill i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:var(--dot)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);
  box-shadow:0 3px 10px var(--ring)}
.pill.on em{color:var(--on-accent);opacity:.72}
.pill.today:not(.on){border-color:var(--accent)}

/* ---------- navigazione ---------- */
.nav{display:flex;align-items:center;gap:12px;margin:14px 0 2px}
.navbtn{border:1px solid var(--line);background:var(--surface-1);color:var(--text);
  width:42px;height:42px;border-radius:13px;font-size:17px;cursor:pointer;flex:none;
  display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .12s}
.navbtn:disabled{opacity:.3;box-shadow:none}
.navbtn:active:not(:disabled){transform:scale(.9)}
.navlbl{flex:1;text-align:center;min-width:0}
.navlbl b{display:block;font-size:21px;font-weight:660;letter-spacing:-.025em;line-height:1.15}
.navlbl span{font-size:12.5px;color:var(--text-faint)}
.tag{display:inline-block;margin-left:7px;font-size:9.5px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:var(--on-accent);background:var(--accent);
  border-radius:5px;padding:2px 6px;vertical-align:3px}

/* ---------- card ---------- */
#view{animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);margin:13px 0;overflow:hidden}
.pad{padding:15px 16px}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:750;
  letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint);margin:0 0 11px}
.eyebrow .chip{margin-left:auto;text-transform:none;letter-spacing:0;font-size:11px;
  font-weight:650;padding:3px 9px;border-radius:99px;background:var(--surface-3);color:var(--ic)}

/* allenamento */
.sess{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.sess:first-of-type{border-top:0;padding-top:0}
.sess .ic{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-size:19px;background:var(--surface-3)}
.sess b{display:block;font-size:15px;font-weight:620;letter-spacing:-.01em}
.sess p{margin:3px 0 0;font-size:13px;color:var(--text-dim);line-height:1.5}
.note{margin:11px 0 0;font-size:12.5px;color:var(--text-dim);background:var(--surface-3);
  border-radius:12px;padding:10px 12px;line-height:1.55}
.meta{margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line);
  font-size:12px;color:var(--text-faint)}

/* fabbisogno: donut + tessere */
.energy{display:flex;align-items:center;gap:16px}
.donut{width:118px;height:118px;flex:none;position:relative}
.donut svg{transform:rotate(-90deg);display:block}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{display:block;font-size:23px;font-weight:680;letter-spacing:-.035em;line-height:1}
.donut .mid span{font-size:10.5px;color:var(--text-faint);letter-spacing:.3px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.leg{display:flex;align-items:center;gap:9px;font-size:13px}
.leg i{width:9px;height:9px;border-radius:3px;flex:none}
.leg span{color:var(--text-dim)}
.leg b{margin-left:auto;font-weight:640;font-variant-numeric:tabular-nums}
.srcline{margin:13px 0 0;padding-top:11px;border-top:1px solid var(--line);
  font-size:12px;color:var(--text-faint)}
.split{display:flex;gap:9px;margin:12px 0 0}
.split div{flex:1;background:var(--surface-3);border-radius:12px;padding:9px 10px;text-align:center;
  font-size:11.5px;color:var(--text-faint)}
.split b{display:block;font-size:15px;color:var(--text);font-weight:650;letter-spacing:-.02em;margin-bottom:1px}

/* insight */
.insight p{margin:0;font-size:14px;line-height:1.65;color:var(--text)}

/* pasti */
.meal{border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;min-height:56px}
.mhead .ic{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-size:17px;background:var(--surface-3)}
.mhead .t{flex:1;min-width:0}
.mhead b{display:block;font-size:14.5px;font-weight:630}
.mhead b i{font-style:normal;font-weight:400;color:var(--text-faint);font-size:12px}
.mhead .sub{display:block;font-size:12px;color:var(--text-faint);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chev{font-size:11px;color:var(--text-faint);transition:transform .25s ease;flex:none;width:16px;text-align:center}
.meal.open .chev{transform:rotate(90deg)}
.mbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.meal.open .mbody{grid-template-rows:1fr}
.mbody>div{overflow:hidden}
.mbody-in{padding:0 16px 15px}
.opt{background:var(--surface-3);border-radius:14px;padding:12px 13px;margin-top:9px}
.opt>em{display:block;font-style:normal;font-size:10px;font-weight:750;letter-spacing:.7px;
  text-transform:uppercase;color:var(--text-faint);margin-bottom:3px}
.opt>b{display:block;font-size:13.5px;font-weight:620;margin-bottom:9px;line-height:1.45}
.ing{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;
  border-top:1px solid var(--line)}
.ing:first-of-type{border-top:0}
.ing s{text-decoration:none;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:560}
.tot{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:3px 13px;font-size:12.5px;color:var(--text-dim);
  font-variant-numeric:tabular-nums}
.tot b{color:var(--text);font-weight:650}
.tot .c{color:var(--carb)} .tot .p{color:var(--prot)} .tot .f{color:var(--fat)}

/* fueling */
.phase{background:var(--surface-3);border-radius:14px;padding:12px 13px;margin-top:10px}
.phase>b{display:block;font-size:13px;font-weight:660;margin-bottom:8px}
.supp{margin:12px 0 0;font-size:12.5px;color:var(--text-dim);line-height:1.6}

footer{margin:24px 0 0;padding:16px 0 0;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--text-faint);line-height:1.65}
footer b{color:var(--text-dim);font-weight:650}
footer p{margin:0 0 8px}
@media (max-width:359px){ .energy{flex-direction:column;align-items:stretch;gap:12px}
  .donut{margin:0 auto} }
</style>
</head>

const D = DATA.days;
const INT = { high:{l:'Intensa',c:'var(--crit)'}, medium:{l:'Media',c:'var(--warn)'},
              low:{l:'Leggera',c:'var(--good)'}, rest:{l:'Riposo',c:'var(--text-faint)'} };

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = v => Math.round(v).toLocaleString('it-IT');
const todayISO = () => { const t = new Date();
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); };

let TODAY = D.findIndex(d => d.iso === todayISO());
if (TODAY < 0) TODAY = 0;
let idx = TODAY;

/* anello macro */
function donut(t){
  const kc = t.c*4, kp = t.p*4, kf = t.f*9, tot = kc+kp+kf || 1;
  const R = 46, C = 2*Math.PI*R, GAP = 5;
  let off = 0, seg = '';
  [[kc,'var(--carb)'],[kp,'var(--prot)'],[kf,'var(--fat)']].forEach(([v,col]) => {
    const len = Math.max(v/tot*C - GAP, 0);
    seg += `<circle cx="59" cy="59" r="${R}" fill="none" stroke="${col}" stroke-width="13"
      stroke-linecap="round" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;
    off += v/tot*C;
  });
  return `<div class="donut"><svg viewBox="0 0 118 118" width="118" height="118">
      <circle cx="59" cy="59" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="13"/>${seg}</svg>
    <div class="mid"><b>${n(t.kcal)}</b><span>kcal</span></div></div>`;
}
function legend(t){
  const kc = t.c*4, kp = t.p*4, kf = t.f*9, tot = kc+kp+kf || 1;
  const row = (col,name,g,k) => `<div class="leg"><i style="background:${col}"></i>
    <span>${name} · ${Math.round(k/tot*100)}%</span><b>${n(g)} g</b></div>`;
  return `<div class="legend">
    ${row('var(--carb)','Carboidrati',t.c,kc)}
    ${row('var(--prot)','Proteine',t.p,kp)}
    ${row('var(--fat)','Grassi',t.f,kf)}</div>`;
}
function totals(t, label){
  return `<div class="tot"><b>${label||'Totale'} ${n(t.kcal)} kcal</b>
    <span class="c">C ${n(t.c)} g</span><span class="p">P ${n(t.p)} g</span><span class="f">G ${n(t.f)} g</span></div>`;
}
const items = l => l.map(i =>
  `<div class="ing"><span>${esc(i.name)}</span><s>${esc(i.disp || (n(i.g)+' g'))}</s></div>`).join('');

function strip(){
  document.getElementById('strip').innerHTML = D.map((x,i) =>
    `<button class="pill${i===idx?' on':''}${i===TODAY?' today':''}" data-i="${i}"
      style="--dot:${INT[x.intensity].c}">
      <em>${esc(x.dow.slice(0,3))}</em><b>${esc(x.d.split(' ')[0])}</b><i></i></button>`).join('');
  const on = document.querySelector('.pill.on');
  if (on) on.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
}

function render(){
  const d = D[idx], I = INT[d.intensity];
  document.getElementById('dayName').innerHTML = esc(d.dow) + (idx===TODAY ? '<span class="tag">oggi</span>' : '');
  document.getElementById('dayDate').textContent = d.d + ' 2026';
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === D.length-1;
  document.getElementById('sub').textContent = D[0].d + ' – ' + D[D.length-1].d + ' 2026';
  strip();

  let h = '';

  /* allenamento */
  h += `<section class="card"><div class="pad">
    <p class="eyebrow" style="--ic:${I.c}">Allenamento<span class="chip">${I.l}</span></p>`;
  h += d.sessions.length
    ? d.sessions.map(s => `<div class="sess"><div class="ic">${s.icon}</div>
        <div><b>${esc(s.title)}</b><p>${esc(s.detail)}</p></div></div>`).join('')
    : `<div class="sess"><div class="ic">😴</div><div><b>Riposo completo</b>
        <p>Nessuna sessione a piano. Giornata di recupero.</p></div></div>`;
  if (d.planned) h += `<p class="note">${esc(d.planned)}</p>`;
  if (d.alt) h += `<p class="note">⚠️ ${esc(d.alt)}</p>`;
  h += `<p class="meta">${esc(d.load)}</p></div></section>`;

  /* insight — solo giorni con attività completata */
  if (d.insight) h += `<section class="card insight"><div class="pad">
    <p class="eyebrow">Insight</p><p>${esc(d.insight)}</p></div></section>`;

  /* fabbisogno */
  h += `<section class="card"><div class="pad">
    <p class="eyebrow">Fabbisogno stimato</p>
    <div class="energy">${donut(d.targets)}${legend(d.targets)}</div>
    <p class="srcline">${n(DATA.base)} kcal di base${d.spend ? ' + ' + n(d.spend) + ' kcal di sessione' : ' · nessuna sessione'}</p>`;
  if (d.fuelTotals) h += `<div class="split">
      <div><b>${n(d.mealBudget.kcal)}</b>dai pasti</div>
      <div><b>${n(d.fuelTotals.kcal)}</b>dal fueling</div></div>
    <p class="note">I pasti qui sotto coprono ${n(d.mealBudget.kcal)} kcal: il resto arriva dal fueling pre/intra/post, tenuto separato per non contarlo due volte.</p>`;
  h += `</div></section>`;

  /* fueling */
  if (d.fuel){
    h += `<section class="card"><div class="pad">
      <p class="eyebrow">Fueling sessione</p>
      <p class="note" style="margin-top:0">${esc(d.fuel.note)}</p>`;
    ['pre','intra','post'].forEach(k => {
      const p = d.fuel[k]; if (!p) return;
      h += `<div class="phase"><b>${esc(p.label)}</b>${items(p.items)}${totals(p.totals,'Totale fase')}</div>`;
    });
    if (d.fuel.supp) h += `<p class="supp"><b>Supplementi.</b> ${esc(d.fuel.supp)}</p>`;
    h += `</div></section>`;
  }

  /* pasti */
  h += `<section class="card">`;
  d.meals.forEach((m,i) => {
    h += `<div class="meal" id="meal${i}">
      <div class="mhead" data-m="${i}"><div class="ic">${m.icon}</div>
        <div class="t"><b>${esc(m.name)} <i>${m.pct}%</i></b>
          <span class="sub">${n(m.target.kcal)} kcal · C ${n(m.target.c)} · P ${n(m.target.p)} · G ${n(m.target.f)} g</span></div>
        <div class="chev">▶</div></div>
      <div class="mbody"><div><div class="mbody-in">`;
    m.options.forEach((o,j) => {
      h += `<div class="opt"><em>Opzione ${j+1}</em><b>${esc(o.name)}</b>${items(o.items)}${totals(o.totals)}</div>`;
    });
    h += `</div></div></div></div>`;
  });
  h += `</section>`;

  const v = document.getElementById('view');
  v.style.animation = 'none'; v.offsetHeight; v.style.animation = '';
  v.innerHTML = h;
}

function go(i){ if (i>=0 && i<D.length && i!==idx){ idx = i; render(); } }

document.addEventListener('click', e => {
  const p = e.target.closest('.pill');
  if (p){ go(+p.dataset.i); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const mh = e.target.closest('.mhead');
  if (mh){ document.getElementById('meal'+mh.dataset.m).classList.toggle('open'); }
});
document.getElementById('prev').onclick = () => go(idx-1);
document.getElementById('next').onclick = () => go(idx+1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  go(idx-1);
  if (e.key === 'ArrowRight') go(idx+1);
});

/* swipe orizzontale per cambiare giorno */
let sx = 0, sy = 0, tracking = false;
document.getElementById('view').addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
}, {passive:true});
document.getElementById('view').addEventListener('touchend', e => {
  if (!tracking) return; tracking = false;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.8){
    go(dx < 0 ? idx+1 : idx-1);
    window.scrollTo({top:0,behavior:'smooth'});
  }
}, {passive:true});

document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

document.getElementById('foot').innerHTML = `
<p><b>Metodo.</b> Fabbisogno = BMR (Mifflin-St Jeor, ${DATA.weight} kg / 183 cm / 29 anni → ${n(DATA.bmr)} kcal) × 1,3 per l'attività di base, più la spesa stimata della sessione.
Bici: kcal ≈ (TSS/100) × FTP ${DATA.ftp} W × 3,6. Corsa: ≈ 1 kcal/kg/km. Nuoto e forza: stima da durata e intensità.
Proteine 1,8 g/kg (2,0 nei giorni forza), carboidrati da 3,5 a 8 g/kg secondo il carico, grassi a completare. Split pasti 22 / 33 / 12 / 33%.</p>
<p><b>Precisione.</b> Il fabbisogno giornaliero è un calcolo standard verificabile. I valori nutrizionali dei singoli alimenti sono <b>stime generiche</b> (tipo USDA/CREA), non verificate su database di prodotto: per i confezionati di marca lo scostamento può essere del 10-20%. Tolleranza dichiarata sulle ricette: ±10-15%.</p>
<p><b>Fonti.</b> COROS (corsa, nuoto, sonno, HRV, stress, recovery, carico) · Garmin Connect (bici) · TrainingPeaks (piano, TSS). Generata il ${DATA.generated}.</p>`;

render();
</script>
