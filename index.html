<style>
:root{
  --page:#ffffff; --surface-1:#ffffff; --surface-2:#ffffff; --surface-3:#f6f6f5;
  --ink:#16181d; --ink-2:#4a5058; --ink-3:#7c838c; --line:#e5e7ea;
  --carb:#2a78d6; --prot:#eb6834; --fat:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --accent:#173a5e; --rest:#9aa1a9;
  --shadow:0 1px 2px rgba(16,20,28,.05),0 4px 14px rgba(16,20,28,.06);
  --radius:16px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --page:#101010; --surface-1:#1a1a19; --surface-2:#1a1a19; --surface-3:#232322;
  --ink:#eceef0; --ink-2:#b3b8be; --ink-3:#868d95; --line:#2f2f2e;
  --carb:#3987e5; --prot:#d95926; --fat:#199e70; --accent:#8fb6dd;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --page:#101010; --surface-1:#1a1a19; --surface-2:#1a1a19; --surface-3:#232322;
  --ink:#eceef0; --ink-2:#b3b8be; --ink-3:#868d95; --line:#2f2f2e;
  --carb:#3987e5; --prot:#d95926; --fat:#199e70; --accent:#8fb6dd;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 82%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.2px;flex:1;min-width:0}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3);letter-spacing:0}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);background:var(--surface-1);
  color:var(--ink);border-radius:12px;font-size:17px;display:grid;place-items:center;cursor:pointer}
.pills{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;scroll-behavior:smooth}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;min-width:52px;min-height:52px;border:1px solid var(--line);background:var(--surface-1);
  border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;padding:6px 9px;transition:background .18s,color .18s,border-color .18s}
.pill .dw{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:600}
.pill .dn{font-size:16px;font-weight:700;line-height:1.05}
.pill .dt{width:6px;height:6px;border-radius:50%;margin-top:1px}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.on .dw{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .pill.on,@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.on{color:#0e1218}}
.dot-crit{background:var(--crit)} .dot-warn{background:var(--warn)} .dot-good{background:var(--good)} .dot-rest{background:var(--rest)}
main{padding-top:14px;transition:opacity .16s ease}
main.fade{opacity:0}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;margin:0 0 12px}
.card.accent{border-left:4px solid var(--edge,var(--rest))}
.dayhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:2px}
.dayhead h1{font-size:19px;margin:0;letter-spacing:-.3px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);border:1px solid var(--line)}
.badge.today{background:var(--accent);color:#fff;border-color:var(--accent)}
.sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);margin:0 0 10px;font-weight:700}
.act{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.act:first-of-type{border-top:0;padding-top:2px}
.act .ic{font-size:22px;line-height:1.2}
.act .nm{font-weight:650;font-size:14.5px}
.act .de{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.act .ts{margin-top:5px;font-size:12px;color:var(--ink-3)}
.act .ts b{color:var(--ink)}
.up{color:var(--serious);font-weight:700}
.note{margin-top:10px;padding:9px 11px;background:var(--surface-3);border-radius:11px;
  font-size:12.5px;color:var(--ink-2);line-height:1.55}
.ring{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring svg{flex:0 0 132px}
.leg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px}
.leg .r{display:flex;align-items:center;gap:8px;font-size:13px}
.leg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px}
.leg .nm{flex:1;color:var(--ink-2)}
.leg .g{font-weight:700;font-variant-numeric:tabular-nums}
.leg .pc{color:var(--ink-3);font-size:11.5px;width:38px;text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:359px){.ring{flex-direction:column;align-items:flex-start}}
.wellgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:8px}
.w{background:var(--surface-3);border-radius:11px;padding:8px 9px}
.w .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);font-weight:600}
.w .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.w .s{font-size:11px;color:var(--ink-3)}
.meal{background:var(--surface-3);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden}
.mh{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;min-height:44px}
.mh .mi{font-size:18px}
.mh .mn{font-weight:700;font-size:14.5px;flex:0 0 auto}
.mh .mt{flex:1;text-align:right;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mh .ch{transition:transform .2s;color:var(--ink-3);font-size:12px}
.meal.open .ch{transform:rotate(90deg)}
.mb{max-height:0;overflow:hidden;transition:max-height .28s ease}
.meal.open .mb{max-height:2400px}
.mbi{padding:0 12px 12px}
.opt{background:var(--surface-1);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-top:9px}
.opt .ol{font-weight:650;font-size:13px;margin-bottom:6px}
.opt ul{margin:0;padding-left:17px}
.opt li{font-size:13px;margin:2px 0}
.opt li b{font-variant-numeric:tabular-nums}
.tot{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-2);
  display:flex;gap:9px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tot span b{color:var(--ink)}
.warnrec{margin-top:6px;font-size:11.5px;color:var(--serious)}
.fuel .ph{margin-top:11px}
.fuel .ph:first-child{margin-top:4px}
.ph h3{font-size:12px;margin:0 0 5px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
.ph ul{margin:0;padding-left:17px}
.ph li{font-size:13px;margin:2px 0}
.nav{display:flex;gap:10px;margin:14px 0 6px}
.nav button{flex:1;min-height:46px;border:1px solid var(--line);background:var(--surface-1);color:var(--ink);
  border-radius:13px;font-size:14px;font-weight:600;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
footer{color:var(--ink-3);font-size:11.5px;line-height:1.6;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
footer b{color:var(--ink-2)}
.dev{margin-top:10px;padding:9px 11px;border-radius:11px;font-size:12.5px;line-height:1.55;
  background:color-mix(in srgb,var(--warn) 13%,transparent);border:1px solid color-mix(in srgb,var(--warn) 34%,transparent);color:var(--ink-2)}
</style>
</head>

function donut(c,p,f,label){

  let a=-Math.PI/2,out="";
  for(const [frac,col] of segs){

    const x1=CX+R*Math.cos(a+GAP/2),y1=CY+R*Math.sin(a+GAP/2);
    const x2=CX+R*Math.cos(a+GAP/2+sweep),y2=CY+R*Math.sin(a+GAP/2+sweep);
    out+=`<path d="M${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${sweep>Math.PI?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${col}" stroke-width="${SW}" stroke-linecap="round"/>`;
    a+=frac*Math.PI*2;
  }
  return `<svg viewBox="0 0 132 132" width="132" height="132" role="img" aria-label="Ripartizione macro">${out}
    <text x="66" y="62" text-anchor="middle" font-size="25" font-weight="700" fill="var(--ink)">${n(label||tot)}</text>
    <text x="66" y="80" text-anchor="middle" font-size="11" fill="var(--ink-3)">kcal</text></svg>`;

  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.8){ dx<0?go(idx+1):go(idx-1); }
},{passive:true});
const root=document.documentElement,tgb=document.getElementById("tg");
try{const s=localStorage.getItem("th-theme"); if(s)root.setAttribute("data-theme",s);}catch(e){}
tgb.onclick=()=>{

  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  const nx=dark?"light":"dark"; root.setAttribute("data-theme",nx);

};
